[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exam-photo-engine"
version = "0.1.0"
description = "Indian Exam-Photo Compliance image engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Indian Exam Photo compliance Platform team" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]
dependencies = [
    # 10.1 is the floor, not a preference: it added the scalable bundled font
    # (`ImageFont.load_default(size=...)`) that the DEC-063 watermark is drawn
    # in.  Before it the only built-in font is a bitmap fixed at one size,
    # which would put the same small mark on a 200 px signature and a 1200 px
    # declaration.
    "Pillow>=10.1.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    # Declared because DEC-070 calls Razorpay's Orders API at runtime. It was
    # already present transitively via the FastAPI test client, which is not
    # the same as being a dependency: a serving image installs no test extras.
    "httpx>=0.27.0",
    # PDF reading and structural rewriting. pypdf is pure Python and BSD
    # licensed; PyMuPDF is faster and can rasterise, but it is AGPL, which is
    # not compatible with shipping this as a commercial service.
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "types-Pillow>=10.1.0",
    "httpx>=0.22.0",
]
# Face-detection extra: install with  pip install -e ".[dev,face]"
# Tests that require a real model are skipped unless EXAM_PHOTO_FACE_MODEL_PATH is set.
face = [
    "mediapipe~=0.10.35",
]
# Matting extra: BiRefNet-based subject segmentation (see DEC-031). Install with
# pip install -e ".[dev,face,matting]". Optional because it pulls torch, which is
# a large dependency the core engine and MediaPipe-only deployments do not need.
# Also required to run scripts/export_birefnet_onnx.py (the ONNX export needs the
# PyTorch checkpoint as its source), but not required to run the ONNX backend
# itself -- see the `matting-onnx` extra below.
matting = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.40.0",
    "timm>=1.0.0",
    "einops>=0.7.0",
    "kornia>=0.7.0",
    "huggingface_hub>=0.23.0",
    "onnx>=1.16.0",
    "deform_conv2d_onnx_exporter>=1.1.0",
]
# ONNX matting extra (faster-matting Step 1): the "birefnet_onnx" backend at
# runtime. No torch/transformers -- onnxruntime alone runs the exported graph,
# which is the point: a deployment that only ever uses this backend does not
# need the ~2 GB `matting` extra. Install with pip install -e ".[dev,face,matting-onnx]".
matting-onnx = [
    "onnxruntime>=1.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/exam_photo"]
# The test bench is a data file next to the module that serves it; without
# this it is dropped from the wheel and /test 500s on an installed copy.
artifacts = ["src/exam_photo/api/*.html"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
disable_error_code = [
    "import-untyped"
]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "mandatory_segmentation: real segmentation tests required for Milestone 7 completion",
    "mandatory_refinement: real refinement tests required for Milestone 8 completion",
    "mandatory_crop: real exact-aspect crop tests required for Milestone 9 completion",
    "mandatory_crop_b: marks tests that depend on Crop Mode B implementations",
    "mandatory_background: marks tests that depend on background composition",
    "mandatory_output_preparation: marks tests that depend on output preparation implementations",
    "mandatory_output_compression: marks tests that depend on output compression implementations",
    "mandatory_rule_pipeline: marks tests that depend on the complete rule-orchestrated pipeline",
    "mandatory_api: marks tests that depend on local API and job orchestration",
    "mandatory_rule_admin: marks tests that depend on the rule validation and admin endpoints",
    "mandatory_engine_quality: marks engine quality tests for visual and composition hardening",
    "ink_robustness: sweeps the ink path over synthetic capture variation; slow, and gated like the model-backed suites so the fast subset stays fast",
]
