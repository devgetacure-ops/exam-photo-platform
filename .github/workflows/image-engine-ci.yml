name: Image Engine CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# What runs here is what the product ships: format, lint, types, the unit and
# integration suites, the package build, and the web app. The June fixture
# benchmarks and CLI smoke checks predate the August engine changes (head
# width from the head, BiRefNet matting) and still carry June expectations;
# they live in engine-quality-full.yml and run by hand.

jobs:
  engine:
    runs-on: ubuntu-latest
    # Every pytest step collects the whole suite, and the mediapipe detector
    # tests refuse to import in CI without this model path. The file is
    # downloaded before the first pytest step, so it is safe job-wide.
    env:
      EXAM_PHOTO_FACE_MODEL_PATH: model-assets/blaze_face_short_range.tflite
      EXAM_PHOTO_FACE_MODEL_SHA256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # The same system libraries deploy/Dockerfile installs: opencv needs
    # libgl1 and libglib2.0-0 to import, and mediapipe's tasks API dlopens
    # libGLESv2.so.2 (libgles2, libegl1) on its first detection.
    - name: Install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgles2 libegl1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e "services/image-engine[dev,face,matting-onnx]"

    - name: Run Ruff format check
      run: |
        ruff format --check services/image-engine

    - name: Run Ruff lint check
      run: |
        ruff check services/image-engine

    - name: Run Mypy type check
      run: |
        mypy services/image-engine/src services/image-engine/tests

    - name: Download Face Detection Model Asset
      run: |
        python scripts/download_model.py --variant short_range --yes

    - name: Run Core Unit Checks (Excluding integration tests)
      run: |
        pytest services/image-engine -m "not mandatory_segmentation and not mandatory_refinement and not mandatory_crop and not mandatory_crop_b and not mandatory_background and not mandatory_output_preparation and not mandatory_output_compression and not mandatory_rule_pipeline and not mandatory_api and not mandatory_rule_admin and not mandatory_engine_quality and not ink_robustness"

    - name: Run Ink Capture-Robustness Sweep
      run: |
        pytest services/image-engine -m "ink_robustness"

    - name: Download Segmenter Model Assets
      run: |
        python scripts/download_segmenter.py --variant selfie_bin_general --yes
        python scripts/download_segmenter.py --variant selfie_multiclass_256x256 --yes

    # The pipeline's matting backend is BiRefNet (DEC-060: "auto" never falls
    # back to MediaPipe), and its ONNX graph is derived rather than downloaded.
    # Build it exactly as deploy/Dockerfile's model-fetch does, once, and cache
    # it; the export's manifest.json beside the weights carries this build's
    # checksum.
    - name: Restore BiRefNet ONNX
      id: birefnet-cache
      uses: actions/cache@v4
      with:
        path: model-assets/birefnet_onnx
        key: birefnet-onnx-${{ hashFiles('model-manifests/birefnet.json', 'scripts/export_birefnet_onnx.py') }}

    - name: Build BiRefNet ONNX
      if: steps.birefnet-cache.outputs.cache-hit != 'true'
      run: |
        pip install --extra-index-url https://download.pytorch.org/whl/cpu -e "services/image-engine[matting,matting-onnx]"
        python scripts/download_birefnet.py --yes
        python scripts/export_birefnet_onnx.py
        rm -rf model-assets/birefnet

    # -v names each test as it runs, and faulthandler dumps every thread's
    # stack if one test runs past five minutes, so a hang says where it is.
    - name: Run Integration Suites
      timeout-minutes: 45
      env:
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        pytest services/image-engine -v -o faulthandler_timeout=300 -m "mandatory_segmentation or mandatory_refinement or mandatory_crop or mandatory_crop_b or mandatory_background or mandatory_output_preparation or mandatory_output_compression or mandatory_rule_pipeline or mandatory_api or mandatory_rule_admin"

    - name: Verify serve-api CLI help
      run: |
        python -m exam_photo serve-api --help

    - name: Build package
      run: |
        pip install build
        python -m build services/image-engine

  web:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # pdfjs-dist 6.3 requires Node 22.13+, and deploy/web.Dockerfile builds on
    # node:22-slim.
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'apps/web/package-lock.json'

    - name: Install Node dependencies
      run: |
        cd apps/web
        npm ci

    - name: Run Web lint
      run: |
        cd apps/web
        npm run lint

    - name: Run Web typecheck
      run: |
        cd apps/web
        npm run typecheck

    - name: Run Web tests
      run: |
        cd apps/web
        npm test

    - name: Build Web application
      run: |
        cd apps/web
        npm run build
