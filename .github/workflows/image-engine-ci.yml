name: Image Engine CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  check-format-lint-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e services/image-engine[dev,face]

    - name: Run Ruff format check
      run: |
        ruff format --check services/image-engine

    - name: Run Ruff lint check
      run: |
        ruff check services/image-engine

    - name: Run Mypy type check
      run: |
        mypy services/image-engine/src services/image-engine/tests

    - name: Download Face Detection Model Asset
      run: |
        python scripts/download_model.py --variant short_range --yes

    - name: Run Core Unit Checks (Excluding mandatory segmenter and refinement tests)
      env:
        EXAM_PHOTO_FACE_MODEL_PATH: model-assets/blaze_face_short_range.tflite
        EXAM_PHOTO_FACE_MODEL_SHA256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f
      run: |
        pytest services/image-engine -m "not mandatory_segmentation and not mandatory_refinement and not mandatory_crop and not mandatory_crop_b and not mandatory_background and not mandatory_output_preparation and not mandatory_output_compression and not mandatory_rule_pipeline and not mandatory_api"

    - name: Download Binary Segmenter Model Asset
      run: |
        python scripts/download_segmenter.py --variant selfie_bin_general --yes

    - name: Run Binary Integration Tests
      env:
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        pytest services/image-engine -m "mandatory_segmentation"

    - name: Download Multiclass Segmenter Model Asset
      run: |
        python scripts/download_segmenter.py --variant selfie_multiclass_256x256 --yes

    - name: Run Multiclass Smoke and Regression Benchmark Checks
      run: |
        python scripts/benchmark_subject_segmenter.py --require-real

    - name: Run Refinement Integration Tests
      env:
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        pytest services/image-engine -m "mandatory_refinement"

    - name: Run Mask Refinement Benchmark
      run: |
        python scripts/benchmark_mask_refinement.py --require-real

    - name: Verify refine-mask CLI
      env:
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        python -m exam_photo refine-mask --input tests/fixtures/single_face_frontal.jpg

    - name: Run Crop Mode A Integration Tests
      env:
        EXAM_PHOTO_FACE_MODEL_PATH: model-assets/blaze_face_short_range.tflite
        EXAM_PHOTO_FACE_MODEL_SHA256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        pytest services/image-engine -m "mandatory_crop"

    - name: Run Crop Mode B Integration Tests
      env:
        EXAM_PHOTO_FACE_MODEL_PATH: model-assets/blaze_face_short_range.tflite
        EXAM_PHOTO_FACE_MODEL_SHA256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        pytest services/image-engine -m "mandatory_crop_b"

    - name: Run Crop Mode A Benchmark
      run: |
        python scripts/benchmark_crop_mode_a.py --require-real

    - name: Run Crop Mode B Benchmark
      run: |
        python scripts/benchmark_crop_mode_b.py --require-real

    - name: Run Background Composition Integration Tests
      env:
        EXAM_PHOTO_FACE_MODEL_PATH: model-assets/blaze_face_short_range.tflite
        EXAM_PHOTO_FACE_MODEL_SHA256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        pytest services/image-engine -m "mandatory_background"

    - name: Run Background Composition Benchmark
      run: |
        python scripts/benchmark_background_composition.py --require-real

    - name: Verify plan-crop-mode-a CLI
      env:
        EXAM_PHOTO_FACE_MODEL_PATH: model-assets/blaze_face_short_range.tflite
        EXAM_PHOTO_FACE_MODEL_SHA256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        python -m exam_photo plan-crop-mode-a --input tests/fixtures/single_face_frontal.jpg --target-width 300 --target-height 400

    - name: Verify plan-crop-mode-b CLI
      env:
        EXAM_PHOTO_FACE_MODEL_PATH: model-assets/blaze_face_short_range.tflite
        EXAM_PHOTO_FACE_MODEL_SHA256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        python -m exam_photo plan-crop-mode-b --input tests/fixtures/single_face_frontal.jpg --min-width 300 --max-width 450 --min-height 400 --max-height 600

    - name: Verify compose-background CLI
      env:
        EXAM_PHOTO_FACE_MODEL_PATH: model-assets/blaze_face_short_range.tflite
        EXAM_PHOTO_FACE_MODEL_SHA256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        python -m exam_photo compose-background --input tests/fixtures/single_face_frontal.jpg

    - name: Run Output Preparation Integration Tests
      env:
        EXAM_PHOTO_FACE_MODEL_PATH: model-assets/blaze_face_short_range.tflite
        EXAM_PHOTO_FACE_MODEL_SHA256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        pytest services/image-engine -m "mandatory_output_preparation"

    - name: Run Output Preparation Benchmark
      run: |
        python scripts/benchmark_output_preparation.py --require-real

    - name: Verify prepare-output CLI
      env:
        EXAM_PHOTO_FACE_MODEL_PATH: model-assets/blaze_face_short_range.tflite
        EXAM_PHOTO_FACE_MODEL_SHA256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        python -m exam_photo prepare-output --input tests/fixtures/single_face_frontal.jpg --target-width 300 --target-height 400

    - name: Run Output Compression Integration Tests
      env:
        EXAM_PHOTO_FACE_MODEL_PATH: model-assets/blaze_face_short_range.tflite
        EXAM_PHOTO_FACE_MODEL_SHA256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        pytest services/image-engine -m "mandatory_output_compression"

    - name: Run Output Compression Benchmark
      run: |
        python scripts/benchmark_image_compression.py --require-real

    - name: Verify compress-output CLI
      env:
        EXAM_PHOTO_FACE_MODEL_PATH: model-assets/blaze_face_short_range.tflite
        EXAM_PHOTO_FACE_MODEL_SHA256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        python -m exam_photo compress-output --input tests/fixtures/single_face_frontal.jpg --target-width 300 --target-height 400 --maximum-bytes 50000

    - name: Run Rule-Orchestrated Pipeline Integration Tests
      env:
        EXAM_PHOTO_FACE_MODEL_PATH: model-assets/blaze_face_short_range.tflite
        EXAM_PHOTO_FACE_MODEL_SHA256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        pytest services/image-engine -m "mandatory_rule_pipeline"

    - name: Run Rule-Orchestrated Pipeline Benchmark
      run: |
        python scripts/benchmark_rule_pipeline.py --require-real

    - name: Verify process-rule CLI
      env:
        EXAM_PHOTO_FACE_MODEL_PATH: model-assets/blaze_face_short_range.tflite
        EXAM_PHOTO_FACE_MODEL_SHA256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        python -m exam_photo process-rule \
          --input tests/fixtures/single_face_frontal.jpg \
          --rule examples/rules/sample_exact_300x400_50kb_white_bg.json \
          --output-dir .tmp_m14 \
          --save-output \
          --overwrite

    - name: Run Local Processing API Integration Tests
      env:
        EXAM_PHOTO_FACE_MODEL_PATH: model-assets/blaze_face_short_range.tflite
        EXAM_PHOTO_FACE_MODEL_SHA256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        pytest services/image-engine -m "mandatory_api"

    - name: Run API Processing Smoke Test
      env:
        EXAM_PHOTO_FACE_MODEL_PATH: model-assets/blaze_face_short_range.tflite
        EXAM_PHOTO_FACE_MODEL_SHA256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f
        EXAM_PHOTO_SEGMENTER_MODEL_PATH: model-assets/selfie_segmentation.tflite
        EXAM_PHOTO_SEGMENTER_MODEL_SHA256: 9ee168ec7c8f2a16c56fe8e1cfbc514974cbbb7e434051b455635f1bd1462f5c
      run: |
        python scripts/smoke_api_processing.py --require-real

    - name: Verify serve-api CLI help
      run: |
        python -m exam_photo serve-api --help

    - name: Build package
      run: |
        pip install build
        python -m build services/image-engine

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'apps/web/package-lock.json'

    - name: Install Node dependencies
      run: |
        cd apps/web
        npm ci

    - name: Run Web lint
      run: |
        cd apps/web
        npm run lint

    - name: Run Web typecheck
      run: |
        cd apps/web
        npm run typecheck

    - name: Run Web tests
      run: |
        cd apps/web
        npm test

    - name: Build Web application
      run: |
        cd apps/web
        npm run build

